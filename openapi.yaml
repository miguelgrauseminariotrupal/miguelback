      tags: [Asistencias]
      summary: Listar asistencias
      parameters:
        - name: id_matricula
          in: query
          schema: { type: integer }
        - name: id_tipo_asistencia
          in: query
          schema: { type: integer }
        - name: fecha
          in: query
          description: Filtra por una fecha exacta (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: fecha_desde
          in: query
          schema: { type: string, format: date }
        - name: fecha_hasta
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista de asistencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asistencia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Asistencias]
      summary: Registrar asistencia
      description: >
        Campos obligatorios: `id_matricula`, `id_tipo_asistencia`, `fecha`.
        Se rechaza con 409 si ya existe un registro para esa matrícula en esa
        fecha (chequeo a nivel de aplicación; no hay UNIQUE en la base).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsistenciaCreate' }
      responses:
        '201':
          description: Asistencia registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asistencia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /asistencias/{id}:
    get:
      tags: [Asistencias]
      summary: Obtener asistencia por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Asistencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asistencia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Asistencias]
      summary: Corregir un registro de asistencia
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsistenciaUpdate' }
      responses:
        '200':
          description: Asistencia actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asistencia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matricula-cursos:
    get:
      tags: [MatriculaCursos]
      summary: Listar matrículas de curso
      parameters:
        - name: id_matricula
          in: query
          schema: { type: integer }
        - name: id_programacion_curso
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de matrículas de curso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatriculaCurso' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [MatriculaCursos]
      summary: Crear una matrícula de curso manualmente
      description: "Campos obligatorios: `id_matricula`, `id_programacion_curso`. Opcional: `estado` (default true). Para generación masiva ver /matricula-cursos/generar."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatriculaCursoCreate' }
      responses:
        '201':
          description: Matrícula de curso creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatriculaCurso' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /matricula-cursos/generar:
    post:
      tags: [MatriculaCursos]
      summary: Generar en batch las matrículas de curso
      description: >
        Por cada matrícula a procesar (una sola si se manda `id_matricula`,
        o todas las activas si se omite), resuelve la mg_programacion_seccion
        de su sección, toma los mg_programacion_curso activos de esa
        sección, y crea el mg_matricula_curso que falte para cada
        combinación (matrícula, curso programado). No duplica pares ya
        existentes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerarMatriculaCursoRequest' }
      responses:
        '201':
          description: Resultado del batch (puede crear 0 registros si ya estaba todo generado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerarMatriculaCursoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /matricula-cursos/{id}:
    get:
      tags: [MatriculaCursos]
      summary: Obtener matrícula de curso por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Matrícula de curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatriculaCurso' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [MatriculaCursos]
      summary: Actualizar matrícula de curso
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatriculaCursoUpdate' }
      responses:
        '200':
          description: Matrícula de curso actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatriculaCurso' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

