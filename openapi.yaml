  /nota-competencia:
    put:
      tags: [Notas]
      summary: Actualizar una nota de competencia
      description: >
        Actualiza UNA fila de mg_evaluacion_competencia (la nota final o la
        de un bimestre, según su `id_bimestre`). `id_evaluacion_competencia`
        e `id_valor` son obligatorios (`id_valor: null` limpia la nota).
        `observacion` e `id_bimestre` son opcionales: si se omiten no se
        modifican. Con `id_bimestre` se mueve la fila a otro bimestre (o a
        nota final con `null`); debe ser del año lectivo del curso y no
        chocar con otra nota existente. También acepta PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarNotaCompetenciaRequest' }
      responses:
        '200':
          description: Fila actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluacionCompetencia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: La nota de competencia o el bimestre no existen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nota-capacidad:
    put:
      tags: [Notas]
      summary: Actualizar una nota de capacidad
      description: >
        Actualiza UNA fila de mg_evaluacion_capacidades (la nota final o la
        de un bimestre, según su `id_bimestre`). `id_evaluacion_capacidad`
        e `id_valor` son obligatorios (`id_valor: null` limpia la nota).
        `observacion` e `id_bimestre` son opcionales: si se omiten no se
        modifican. Con `id_bimestre` se mueve la fila a otro bimestre (o a
        nota final con `null`); debe ser del año lectivo del curso y no
        chocar con otra nota existente. `observacion` requiere que la tabla
        tenga esa columna (hoy solo la tiene mg_evaluacion_competencia).
        También acepta PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarNotaCapacidadRequest' }
      responses:
        '200':
          description: Fila actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluacionCapacidad' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: La nota de capacidad o el bimestre no existen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notas-matricula-curso:
    get:
      tags: [Notas]
      summary: Todas las notas de un alumno en un curso
      description: >
        Una sola respuesta con, por competencia: la nota final y los
        bimestres (cada uno con la nota de la competencia en ese bimestre y
        las notas de sus capacidades). Sale de mg_evaluacion_competencia y
        mg_evaluacion_capacidades, donde `id_bimestre` NULL es la nota final.
        Una nota sin asignar viene con `id_valor`/`valor` en null; una
        competencia solo aparece si tiene al menos una fila de evaluación.
        Las notas finales de capacidades no se incluyen.
      parameters:
        - name: id_matricula
          in: query
          required: true
          schema: { type: integer }
        - name: id_curso
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notas de la matrícula en el curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotasMatriculaCursoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No existe una matrícula de ese alumno en ese curso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /docente-responsable:
    get:
      tags: [DocenteResponsable]
      summary: Docente que dicta un curso puntual en una sección
      description: >
        Resuelve mg_programacion_seccion por 'id_seccion', y dentro de esa
        programación busca mg_programacion_curso para 'id_curso', devolviendo
        el docente asignado (mg_programacion_curso.id_docente).
      parameters:
        - name: id_seccion
          in: query
          required: true
          schema: { type: integer }
        - name: id_curso
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Docente responsable de ese curso en esa sección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocenteResponsableResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: >
            No existe programación para esa sección, o ese curso no está
            programado para esa sección.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /duplicar-anio:
    post:
      tags: [DuplicarAnio]
      summary: Duplicar configuración de un año lectivo a otro, por bloques
      description: >
        Copia estructura académica, cursos, currículo y/o programación de un
        año lectivo (origen) a otro (destino) ya existente, activando solo
        los bloques que se necesiten. Es idempotente: si algo ya existe en el
        destino (por nombre, o por la combinación que corresponda), no lo
        duplica de nuevo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicarAnioRequest' }
      responses:
        '201':
          description: Resultado de la duplicación, por bloque
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicarAnioResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /generar-plantillas-notas:
    post:
      tags: [GenerarPlantillasNotas]
      summary: Generar plantillas de evaluación para un año lectivo
      description: >
        Llama al stored procedure `generar_plantillas_notas(p_id_anio)`
        (corre en una sola transacción en la base). Genera, para todas las
        matrículas de curso del año, las filas de mg_evaluacion_competencia,
        mg_evaluacion_capacidades, mg_evaluacion_competencia_bimestre y
        mg_evaluacion_capacidades_bimestre con id_valor=NULL. Es idempotente:
        volver a llamarla no duplica lo ya generado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerarPlantillasNotasRequest' }
      responses:
        '201':
          description: Conteo de filas creadas por tabla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerarPlantillasNotasResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /chat:
    get:
      tags: [Chat]
      summary: Listar conversaciones o cargar los mensajes de una
      description: >
        Sin `id`: devuelve las últimas 30 conversaciones no archivadas del
        usuario autenticado, la más reciente primero. Con `id`: devuelve los
        mensajes de esa conversación en orden (máximo 200), en formato
        `UIMessage`. Si la conversación no existe o es de otro usuario, 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: query
          description: Uuid de la conversación.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversaciones (sin `id`) o mensajes (con `id`)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/ChatConversacion' }
                  - type: array
                    items: { $ref: '#/components/schemas/ChatMensajeUI' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Chat]
      summary: Enviar un mensaje y recibir la respuesta en streaming
      description: >
        Guarda el mensaje del usuario (creando la conversación si es nueva),
        carga el historial (últimos 20 mensajes) y llama al modelo, que puede
        usar herramientas hasta 8 pasos: años lectivos, estructura académica
        (niveles, grados y secciones), cursos, matrículas, docente
        responsable, notas y asistencias. La conversación se asocia al usuario
        del token; si el `id` pertenece a otro usuario responde 404. La respuesta es un stream SSE del protocolo UI Message
        Stream del Vercel AI SDK (`x-vercel-ai-ui-message-stream: v1`): cada
        línea `data: {...}` trae un chunk (`start`, `text-delta`,
        `tool-input-available`, `tool-output-available`, `finish`, `error`...)
        y termina con `data: [DONE]`. Al finalizar se guarda la respuesta y
        las métricas (tools usadas, tokens, latencia). Si el modelo falla, el
        error llega dentro del stream como `{"type":"error","errorText":...}`
        con status HTTP 200.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Stream SSE con la respuesta del asistente
          headers:
            x-vercel-ai-ui-message-stream:
              schema: { type: string, example: v1 }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                data: {"type":"start","messageId":"..."}

                data: {"type":"text-start","id":"0"}

                data: {"type":"text-delta","id":"0","delta":"El año lectivo..."}

                data: {"type":"finish"}

                data: [DONE]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
