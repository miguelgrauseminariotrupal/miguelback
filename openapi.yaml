openapi: 3.0.3
info:
  title: Mannucci - API de Gestión Académica
  description: >
    API del módulo académico base (años lectivos, niveles, grados, secciones,
    cursos, usuarios, docentes, estudiantes, programación de secciones/cursos
    y matrícula), implementada como Supabase Edge Functions (Deno).


    **Autenticación:** ninguna todavía. Todas las funciones se despliegan con
    `verify_jwt = false`, por lo que no requieren un JWT de usuario en
    `Authorization`. Se recomienda igual enviar el header `apikey` (la
    anon/publishable key del proyecto) por convención de Supabase. Esto debe
    revisarse antes de exponer la API en producción.


    **Sin DELETE:** ningún módulo tiene endpoint `DELETE` por ahora. La
    mayoría de tablas tiene un campo `estado` booleano (`true` = activo, por
    defecto) que se desactiva manualmente mandando `estado: false` en el
    `PUT` correspondiente.


    **Formato de error:** toda respuesta de error usa el mismo cuerpo
    `{ "error": "mensaje" }`, con el código HTTP correspondiente (400, 404,
    409 o 500).
  version: "1.0.0"
  contact:
    name: Asociación Educativa Carlos A. Mannucci

servers:
  - url: https://fqidwaafiojvcamzmilu.supabase.co/functions/v1
    description: Proyecto Supabase (Mannucci)

security:
  - apiKeyAuth: []

tags:
  - name: AniosLectivos
    description: Años lectivos (mg_anio_lectivo)
  - name: Niveles
    description: Niveles educativos por año lectivo (mg_nivel)
  - name: Grados
    description: Grados por nivel (mg_grado)
  - name: Secciones
    description: Secciones por grado (mg_seccion)
  - name: Cursos
    description: Cursos por año lectivo (mg_curso)
  - name: Login
    description: >
      Autenticación contra Supabase Auth (auth.users). Devuelve un JWT
      (access_token) y un refresh_token.
  - name: Usuarios
    description: Cuentas de acceso (mg_usuario), enlazadas a auth.users por auth_id
  - name: Docentes
    description: Docentes, opcionalmente enlazados a un usuario (mg_docente)
  - name: Estudiantes
    description: Estudiantes (mg_estudiante)
  - name: ProgramacionSecciones
    description: Programación anual de una sección (tutor responsable)
  - name: ProgramacionCursos
    description: Cursos programados dentro de una sección
  - name: Matriculas
    description: Matrícula de estudiantes en una sección
  - name: TiposAsistencia
    description: Catálogo de tipos de asistencia (mg_tipo_asistencia)
  - name: Asistencias
    description: Registro diario de asistencia por matrícula (mg_asistencia)
  - name: MatriculaCursos
    description: >
      Asignación de un alumno matriculado a un curso programado
      (mg_matricula_curso), incluyendo el batch de generación automática.
  - name: ValoresEvaluacion
    description: Catálogo de valores de evaluación, ej. A/B/C (mg_valor_evaluacion)
  - name: Aprendizajes
    description: Aprendizajes por año lectivo (mg_aprendizaje)
  - name: Competencias
    description: Competencias por curso, opcionalmente ligadas a un aprendizaje (mg_competencia)
  - name: Capacidades
    description: Capacidades de una competencia (mg_capacidades)
  - name: Bimestres
    description: Bimestres de un año lectivo (mg_bimestre)
  - name: Notas
    description: Consulta de notas (finales y por bimestre) de un alumno en un curso.
  - name: DocenteResponsable
    description: Consulta del docente que dicta un curso puntual en una sección.
  - name: DuplicarAnio
    description: Duplicar configuración de un año lectivo a otro, por bloques.
  - name: GenerarPlantillasNotas
    description: >
      Genera las plantillas de evaluación (filas con id_valor=NULL) para
      todas las matrículas de curso de un año lectivo.
  - name: Chat
    description: >
      Agente conversacional (OpenAI + herramientas que consultan estas mismas
      APIs). Requiere `Authorization: Bearer <access_token>` (POST /login):
      cada usuario solo ve y escribe en sus propias conversaciones.

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: >
        anon/publishable key del proyecto Supabase. No se valida un JWT de
        usuario (verify_jwt=false en todas las funciones), pero se recomienda
        enviar igual este header.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access_token devuelto por POST /login (Supabase Auth).

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
      example:
        error: "Mensaje descriptivo del error"

    AnioLectivo:
      type: object
      properties:
        id_anio_lectivo: { type: integer, readOnly: true }
        anio: { type: integer, example: 2026 }
        nombre: { type: string, example: "Año Escolar 2026" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, anio, nombre, estado]

    AnioLectivoCreate:
      type: object
      properties:
        anio: { type: integer, example: 2026 }
        nombre: { type: string, example: "Año Escolar 2026" }
        estado: { type: boolean, default: true }
      required: [anio, nombre]

    AnioLectivoUpdate:
      type: object
      description: >
        Nota: a diferencia de la creación, esta actualización NO permite
        modificar 'nombre' por ahora (solo 'anio' y 'estado').
      properties:
        anio: { type: integer }
        estado: { type: boolean }

    Nivel:
      type: object
      properties:
        id_nivel: { type: integer, readOnly: true }
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Primaria" }
        estado: { type: boolean, default: true }
      required: [id_nivel, id_anio_lectivo, nombre, estado]

    NivelCreate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Primaria" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, nombre]

    NivelUpdate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Grado:
      type: object
      properties:
        id_grado: { type: integer, readOnly: true }
        id_nivel: { type: integer }
        nombre: { type: string, example: "3er grado" }
        estado: { type: boolean, default: true }
      required: [id_grado, id_nivel, nombre, estado]

    GradoCreate:
      type: object
      properties:
        id_nivel: { type: integer }
        nombre: { type: string, example: "3er grado" }
        estado: { type: boolean, default: true }
      required: [id_nivel, nombre]

    GradoUpdate:
      type: object
      properties:
        id_nivel: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Seccion:
      type: object
      properties:
        id_seccion: { type: integer, readOnly: true }
        id_grado: { type: integer }
        nombre: { type: string, example: "A" }
        estado: { type: boolean, default: true }
      required: [id_seccion, id_grado, nombre, estado]

    SeccionCreate:
      type: object
      properties:
        id_grado: { type: integer }
        nombre: { type: string, example: "A" }
        estado: { type: boolean, default: true }
      required: [id_grado, nombre]

    SeccionUpdate:
      type: object
      properties:
        id_grado: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Curso:
      type: object
      properties:
        id_curso: { type: integer, readOnly: true }
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Matemática" }
        estado: { type: boolean, default: true }
      required: [id_curso, id_anio_lectivo, nombre, estado]

    CursoCreate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Matemática" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, nombre]

    CursoUpdate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    LoginRequest:
      type: object
      properties:
        usuario: { type: string, description: "Nombre de usuario o correo", example: "docente@colegio.edu.pe" }
        password: { type: string, format: password }
      required: [usuario, password]

    Sesion:
      type: object
      properties:
        access_token: { type: string, description: "JWT de Supabase Auth; enviar como Authorization: Bearer" }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "Segundos de vigencia del access_token", example: 3600 }
        expires_at: { type: integer, description: "Epoch (s) de vencimiento" }
        token_type: { type: string, example: bearer }
      required: [access_token, refresh_token, expires_in, token_type]

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Sesion'
        - type: object
          properties:
            correo: { type: string, format: email, example: "70375812@miguelgrau.com" }
            nombres: { type: string, nullable: true, description: "Nombres del usuario (mg_usuario.nombres; si está vacío, los del docente enlazado).", example: "Eloy Gonzalo" }
            apaterno: { type: string, nullable: true, description: "Apellido paterno (mg_usuario.apaterno).", example: "Alva" }
            amaterno: { type: string, nullable: true, description: "Apellido materno (mg_usuario.amaterno).", example: "Calderon" }
            usuario:
              type: object
              properties:
                id_usuario: { type: integer }
                usuario: { type: string }
                correo: { type: string, format: email }
            docente:
              type: object
              nullable: true
              description: Docente enlazado al usuario, o null si no es docente.
              properties:
                id_docente: { type: integer }
                nombres: { type: string }
                apellido_paterno: { type: string, nullable: true }
                apellido_materno: { type: string, nullable: true }
                dni: { type: string, nullable: true }
                telefono: { type: string, nullable: true }
                correo: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
              description: Códigos (mg_rol.codigo) de los roles activos.

    MeResponse:
      type: object
      properties:
        correo: { type: string, format: email }
        nombres: { type: string, nullable: true }
        apaterno: { type: string, nullable: true }
        amaterno: { type: string, nullable: true }
        usuario:
          type: object
          properties:
            id_usuario: { type: integer }
            usuario: { type: string }
            correo: { type: string, format: email }
            estado: { type: boolean }
        docente: { type: object, nullable: true }
        roles:
          type: array
          items: { type: string }

    Usuario:
      type: object
      description: Nunca incluye password_hash.
      properties:
        id_usuario: { type: integer, readOnly: true }
        usuario: { type: string, example: "jperez" }
        correo: { type: string, format: email }
        estado: { type: boolean, default: true }
        fecha_creacion: { type: string, format: date-time, readOnly: true }
        nombres: { type: string, nullable: true, example: "Eloy Gonzalo" }
        apaterno: { type: string, nullable: true, example: "Alva" }
        amaterno: { type: string, nullable: true, example: "Calderon" }
      required: [id_usuario, usuario, correo, estado, fecha_creacion]

    UsuarioCreate:
      type: object
      properties:
        usuario: { type: string, example: "jperez" }
        correo: { type: string, format: email }
        password: { type: string, format: password, minLength: 6 }
        estado: { type: boolean, default: true }
        nombres: { type: string, nullable: true, example: "Eloy Gonzalo" }
        apaterno: { type: string, nullable: true, example: "Alva" }
        amaterno: { type: string, nullable: true, example: "Calderon" }
      required: [usuario, correo, password]

    UsuarioUpdate:
      type: object
      properties:
        usuario: { type: string }
        correo: { type: string, format: email }
        password: { type: string, format: password, minLength: 6 }
        estado: { type: boolean }
        nombres: { type: string, nullable: true, example: "Eloy Gonzalo" }
        apaterno: { type: string, nullable: true, example: "Alva" }
        amaterno: { type: string, nullable: true, example: "Calderon" }

    Docente:
      type: object
      properties:
        id_docente: { type: integer, readOnly: true }
        id_usuario: { type: integer, nullable: true }
        nombres: { type: string, example: "Hugo" }
        apellido_paterno: { type: string, nullable: true, example: "Flores" }
        apellido_materno: { type: string, nullable: true, example: "Rodriguez" }
        dni: { type: string, nullable: true, example: "87654321" }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_docente, nombres, estado]

    DocenteCreate:
      type: object
      description: >
        Si `indUsuario` es true: 'correo' y 'dni' (8 dígitos) pasan a ser
        requeridos. Se crea automáticamente un mg_usuario enlazado, con
        `usuario` = el mismo correo y contraseña = el dni (hasheada). La
        respuesta en ese caso es distinta (ver DocenteConUsuarioResponse).
      properties:
        id_usuario:
          type: integer
          nullable: true
          description: Solo aplica cuando indUsuario no es true.
        nombres: { type: string, example: "Hugo" }
        apellido_paterno: { type: string, example: "Flores" }
        apellido_materno: { type: string, example: "Rodriguez" }
        dni:
          type: string
          example: "87654321"
          description: Requerido (8 dígitos) si indUsuario=true.
        telefono: { type: string }
        correo:
          type: string
          format: email
          description: Requerido si indUsuario=true.
        estado: { type: boolean, default: true }
        indUsuario:
          type: boolean
          default: false
          description: Si es true, crea también el mg_usuario enlazado.
      required: [nombres]

    DocenteUpdate:
      type: object
      properties:
        id_usuario: { type: integer, nullable: true }
        nombres: { type: string }
        apellido_paterno: { type: string, nullable: true }
        apellido_materno: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        estado: { type: boolean }

    DocenteConUsuarioResponse:
      type: object
      description: Respuesta de POST /docentes cuando el body trae indUsuario=true.
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        docente:
          $ref: '#/components/schemas/Docente'
      required: [usuario, docente]

    Estudiante:
      type: object
      properties:
        id_estudiante: { type: integer, readOnly: true }
        nombres: { type: string, example: "Ana" }
        apellido_paterno: { type: string, nullable: true, example: "Torres" }
        apellido_materno: { type: string, nullable: true, example: "Diaz" }
        dni: { type: string, nullable: true, example: "71234567" }
        fecha_nacimiento: { type: string, format: date, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_estudiante, nombres, estado]

    EstudianteCreate:
      type: object
      properties:
        nombres: { type: string, example: "Ana" }
        apellido_paterno: { type: string, example: "Torres" }
        apellido_materno: { type: string, example: "Diaz" }
        dni: { type: string, example: "71234567" }
        fecha_nacimiento: { type: string, format: date, example: "2015-04-12" }
        estado: { type: boolean, default: true }
      required: [nombres]

    EstudianteUpdate:
      type: object
      properties:
        nombres: { type: string }
        apellido_paterno: { type: string, nullable: true }
        apellido_materno: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        fecha_nacimiento: { type: string, format: date, nullable: true }
        estado: { type: boolean }

    ProgramacionSeccion:
      type: object
      properties:
        id_programacion_seccion: { type: integer, readOnly: true }
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado:
          type: boolean
          default: false
          description: >
            true si ya se terminó de configurar la programación de la
            sección. Por defecto false.
      required: [id_programacion_seccion, id_seccion, id_docente_responsable, estado_completado]

    ProgramacionSeccionCreate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado: { type: boolean, default: false }
      required: [id_seccion, id_docente_responsable]

    ProgramacionSeccionUpdate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado: { type: boolean }

    ProgramacionCurso:
      type: object
      properties:
        id_programacion_curso: { type: integer, readOnly: true }
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_programacion_curso, id_programacion_seccion, id_curso, id_docente, estado]

    ProgramacionCursoCreate:
      type: object
      properties:
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_programacion_seccion, id_curso, id_docente]

    ProgramacionCursoUpdate:
      type: object
      properties:
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean }

    Matricula:
      type: object
      description: >
        Relación directa con mg_seccion vía 'id_seccion'. Siempre incluye el
        alumno embebido en 'mg_estudiante' (no hace falta una segunda
        consulta a /estudiantes).
      properties:
        id_matricula: { type: integer, readOnly: true }
        id_seccion: { type: integer }
        id_estudiante: { type: integer }
        fecha_matricula: { type: string, format: date }
        estado: { type: boolean, default: true }
        mg_estudiante:
          type: object
          readOnly: true
          properties:
            id_estudiante: { type: integer }
            nombres: { type: string }
            apellido_paterno: { type: string, nullable: true }
            apellido_materno: { type: string, nullable: true }
            dni: { type: string, nullable: true }
            fecha_nacimiento: { type: string, format: date, nullable: true }
            estado: { type: boolean }
      required: [id_matricula, id_seccion, id_estudiante, fecha_matricula, estado, mg_estudiante]

    MatriculaCreate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_estudiante: { type: integer }
        fecha_matricula:
          type: string
          format: date
          description: Si se omite, la BD usa la fecha actual.
        estado: { type: boolean, default: true }
      required: [id_seccion, id_estudiante]

    MatriculaUpdate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_estudiante: { type: integer }
        fecha_matricula: { type: string, format: date, nullable: true }
        estado: { type: boolean }

    TipoAsistencia:
      type: object
      properties:
        id_tipo_asistencia: { type: integer, readOnly: true }
        codigo: { type: string, example: "TARDANZA" }
        descripcion: { type: string, example: "Tardanza justificada" }
        estado: { type: boolean, default: true }
      required: [id_tipo_asistencia, codigo, descripcion, estado]

    TipoAsistenciaCreate:
      type: object
      properties:
        codigo: { type: string, example: "TARDANZA" }
        descripcion: { type: string, example: "Tardanza justificada" }
        estado: { type: boolean, default: true }
      required: [codigo, descripcion]

    TipoAsistenciaUpdate:
      type: object
      properties:
        codigo: { type: string }
        descripcion: { type: string }
        estado: { type: boolean }

    Asistencia:
      type: object
      description: No tiene campo 'estado' (a diferencia del resto de tablas).
      properties:
        id_asistencia: { type: integer, readOnly: true }
        id_matricula: { type: integer }
        id_tipo_asistencia: { type: integer }
        fecha: { type: string, format: date }
      required: [id_asistencia, id_matricula, id_tipo_asistencia, fecha]

    AsistenciaCreate:
      type: object
      properties:
        id_matricula: { type: integer }
        id_tipo_asistencia: { type: integer }
        fecha: { type: string, format: date, example: "2026-04-10" }
      required: [id_matricula, id_tipo_asistencia, fecha]

    AsistenciaUpdate:
      type: object
      properties:
        id_matricula: { type: integer }
        id_tipo_asistencia: { type: integer }
        fecha: { type: string, format: date }

    MatriculaCurso:
      type: object
      properties:
        id_matricula_curso: { type: integer, readOnly: true }
        id_matricula: { type: integer }
        id_programacion_curso: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_matricula_curso, id_matricula, id_programacion_curso, estado]

    MatriculaCursoCreate:
      type: object
      description: Alta manual de un solo registro (para el batch, ver /matricula-cursos/generar).
      properties:
        id_matricula: { type: integer }
        id_programacion_curso: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_matricula, id_programacion_curso]

    MatriculaCursoUpdate:
      type: object
      properties:
        id_matricula: { type: integer }
        id_programacion_curso: { type: integer }
        estado: { type: boolean }

    GenerarMatriculaCursoRequest:
      type: object
      properties:
        id_matricula:
          type: integer
          description: >
            Si se omite, procesa todas las matrículas activas (estado=true)
            del sistema; si se envía, procesa solo esa matrícula.

    GenerarMatriculaCursoResponse:
      type: object
      properties:
        matriculas_procesadas: { type: integer }
        secciones_sin_programacion:
          type: array
          items: { type: integer }
          description: >
            id_seccion de matrículas procesadas cuya sección todavía no tiene
            mg_programacion_seccion creada (no se generó nada para ellas).
        registros_creados: { type: integer }
        registros_ya_existian: { type: integer }
      required: [matriculas_procesadas, secciones_sin_programacion, registros_creados, registros_ya_existian]

    ValorEvaluacion:
      type: object
      properties:
        id_valor: { type: integer, readOnly: true }
        codigo: { type: string, example: "A" }
        descripcion: { type: string, example: "Logro destacado" }
        estado: { type: boolean, default: true }
      required: [id_valor, codigo, descripcion, estado]

    ValorEvaluacionCreate:
      type: object
      properties:
        codigo: { type: string, example: "A" }
        descripcion: { type: string, example: "Logro destacado" }
        estado: { type: boolean, default: true }
      required: [codigo, descripcion]

    ValorEvaluacionUpdate:
      type: object
      properties:
        codigo: { type: string }
        descripcion: { type: string }
        estado: { type: boolean }

    Aprendizaje:
      type: object
      properties:
        id_aprendizaje: { type: integer, readOnly: true }
        nombre_aprendizaje: { type: string, nullable: true }
        id_anio_lectivo: { type: integer, nullable: true }
        estado: { type: boolean, nullable: true }
      required: [id_aprendizaje]

    AprendizajeCreate:
      type: object
      properties:
        nombre_aprendizaje: { type: string }
        id_anio_lectivo: { type: integer }
        estado: { type: boolean, default: true }
      required: [nombre_aprendizaje]

    AprendizajeUpdate:
      type: object
      properties:
        nombre_aprendizaje: { type: string }
        id_anio_lectivo: { type: integer, nullable: true }
        estado: { type: boolean }

    Competencia:
      type: object
      properties:
        id_competencia: { type: integer, readOnly: true }
        id_curso: { type: integer }
        codigo: { type: string, nullable: true }
        descripcion: { type: string }
        id_aprendizaje: { type: integer, nullable: true }
        tipo: { type: string, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_competencia, id_curso, descripcion, estado]

    CompetenciaCreate:
      type: object
      properties:
        id_curso: { type: integer }
        descripcion: { type: string }
        codigo: { type: string }
        id_aprendizaje: { type: integer }
        tipo: { type: string }
        estado: { type: boolean, default: true }
      required: [id_curso, descripcion]

    CompetenciaUpdate:
      type: object
      properties:
        id_curso: { type: integer }
        descripcion: { type: string }
        codigo: { type: string, nullable: true }
        id_aprendizaje: { type: integer, nullable: true }
        tipo: { type: string, nullable: true }
        estado: { type: boolean }

    Capacidad:
      type: object
      properties:
        id_capacidad: { type: integer, readOnly: true }
        descripcion: { type: string }
        id_competencia: { type: integer, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_capacidad, descripcion, estado]

    CapacidadCreate:
      type: object
      properties:
        descripcion: { type: string }
        id_competencia: { type: integer }
        estado: { type: boolean, default: true }
      required: [descripcion]

    CapacidadUpdate:
      type: object
      properties:
        descripcion: { type: string }
        id_competencia: { type: integer, nullable: true }
        estado: { type: boolean }

    Bimestre:
      type: object
      properties:
        id_bimestre: { type: integer, readOnly: true }
        id_anio_lectivo: { type: integer }
        numero: { type: integer, example: 1 }
        nombre: { type: string, example: "Bimestre 1" }
        fecha_inicio: { type: string, format: date, nullable: true }
        fecha_fin: { type: string, format: date, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_bimestre, id_anio_lectivo, numero, nombre, estado]

    BimestreCreate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        numero: { type: integer, example: 1 }
        nombre: { type: string, example: "Bimestre 1" }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: string, format: date }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, numero, nombre]

    BimestreUpdate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        numero: { type: integer }
        nombre: { type: string }
        fecha_inicio: { type: string, format: date, nullable: true }
        fecha_fin: { type: string, format: date, nullable: true }
        estado: { type: boolean }

    ValorEvaluacionResumen:
      type: object
      nullable: true
      description: Null si la nota todavía no tiene un valor asignado.
      properties:
        codigo: { type: string, example: "AD" }
        descripcion: { type: string, example: "Logro destacado" }

    NotaCompetenciaValor:
      type: object
      nullable: true
      description: Null si no existe la fila de esa nota (plantilla no generada).
      properties:
        id_evaluacion_competencia: { type: integer }
        id_valor: { type: integer, nullable: true }
        valor: { $ref: '#/components/schemas/ValorEvaluacionResumen' }
        observacion: { type: string, nullable: true }

    NotaCapacidadValor:
      type: object
      properties:
        id_evaluacion_capacidad: { type: integer }
        id_valor: { type: integer, nullable: true }
        valor: { $ref: '#/components/schemas/ValorEvaluacionResumen' }

    NotaCapacidadBimestre:
      type: object
      properties:
        id_capacidad: { type: integer }
        descripcion: { type: string, nullable: true }
        nota_bimestre: { $ref: '#/components/schemas/NotaCapacidadValor' }

    NotaBimestreGrupo:
      type: object
      description: Un bimestre dentro de una competencia.
      properties:
        id_bimestre: { type: integer }
        numero: { type: integer, nullable: true }
        nombre: { type: string, nullable: true }
        nota_bimestre: { $ref: '#/components/schemas/NotaCompetenciaValor' }
        capacidades:
          type: array
          items: { $ref: '#/components/schemas/NotaCapacidadBimestre' }

    NotaCompetenciaResumen:
      type: object
      properties:
        id_competencia: { type: integer }
        codigo: { type: string, nullable: true }
        descripcion: { type: string, nullable: true }
        tipo: { type: string, nullable: true }
        nota_final: { $ref: '#/components/schemas/NotaCompetenciaValor' }
        bimestres:
          type: array
          description: Ordenados por número de bimestre.
          items: { $ref: '#/components/schemas/NotaBimestreGrupo' }

    NotasMatriculaCursoResponse:
      type: object
      properties:
        id_matricula: { type: integer }
        id_curso: { type: integer }
        id_matricula_curso: { type: integer }
        competencias:
          type: array
          items: { $ref: '#/components/schemas/NotaCompetenciaResumen' }
      required: [id_matricula, id_curso, id_matricula_curso, competencias]

    ActualizarNotaCompetenciaRequest:
      type: object
      properties:
        id_evaluacion_competencia: { type: integer }
        id_valor:
          type: integer
          nullable: true
          description: id de mg_valor_evaluacion (activo). null limpia la nota.
        observacion:
          type: string
          nullable: true
          description: Opcional. Si se omite no se modifica; null la limpia.
        id_bimestre:
          type: integer
          nullable: true
          description: Opcional. Si se omite no se modifica; null = nota final.
      required: [id_evaluacion_competencia, id_valor]

    ActualizarNotaCapacidadRequest:
      type: object
      properties:
        id_evaluacion_capacidad: { type: integer }
        id_valor:
          type: integer
          nullable: true
          description: id de mg_valor_evaluacion (activo). null limpia la nota.
        observacion:
          type: string
          nullable: true
          description: >
            Opcional. Requiere la columna `observacion` en
            mg_evaluacion_capacidades (hoy no existe en el esquema).
        id_bimestre:
          type: integer
          nullable: true
          description: Opcional. Si se omite no se modifica; null = nota final.
      required: [id_evaluacion_capacidad, id_valor]

    EvaluacionCompetencia:
      type: object
      description: Fila de mg_evaluacion_competencia.
      properties:
        id_evaluacion_competencia: { type: integer }
        id_competencia: { type: integer }
        id_valor: { type: integer, nullable: true }
        id_matricula_curso: { type: integer }
        id_bimestre: { type: integer, nullable: true, description: null = nota final }
        codigo: { type: string, nullable: true }
        observacion: { type: string, nullable: true }
        estado: { type: boolean }

    EvaluacionCapacidad:
      type: object
      description: Fila de mg_evaluacion_capacidades.
      properties:
        id_evaluacion_capacidad: { type: integer }
        id_capacidad: { type: integer }
        id_valor: { type: integer, nullable: true }
        id_matricula_curso: { type: integer }
        id_bimestre: { type: integer, nullable: true, description: null = nota final }
        codigo: { type: string, nullable: true }
        estado: { type: boolean }

    DocenteResponsableResponse:
      type: object
      description: >
        'docente' es quien dicta ESE curso en ESA sección
        (mg_programacion_curso.id_docente) — no confundir con el tutor
        general de la sección (mg_programacion_seccion.id_docente_responsable).
      properties:
        id_seccion: { type: integer }
        id_curso: { type: integer }
        id_programacion_curso: { type: integer }
        estado: { type: boolean }
        docente: { $ref: '#/components/schemas/Docente' }
      required: [id_seccion, id_curso, id_programacion_curso, estado, docente]

    DuplicarAnioRequest:
      type: object
      description: >
        Al menos un 'incluir_*' debe venir en true. Los bloques con
        dependencias (grados necesita niveles, competencias necesita cursos y
        aprendizajes, programacion_cursos necesita programacion_secciones y
        cursos) resuelven el mapeo automáticamente, buscando también lo que
        ya exista en el año destino por nombre (no solo lo creado en la misma
        llamada).
      properties:
        id_anio_origen: { type: integer }
        id_anio_destino: { type: integer }
        incluir_estructura:
          type: boolean
          default: false
          description: Niveles + grados + secciones.
        incluir_cursos:
          type: boolean
          default: false
        incluir_curriculo:
          type: boolean
          default: false
          description: Aprendizajes + competencias + capacidades.
        incluir_programacion_secciones:
          type: boolean
          default: false
          description: >
            Copia la sección con el mismo docente responsable. estado_completado
            siempre queda en false en los registros nuevos (no se copia).
        incluir_programacion_cursos:
          type: boolean
          default: false
          description: Copia curso + mismo docente asignados a cada sección.
      required: [id_anio_origen, id_anio_destino]

    DuplicarAnioResultadoBloque:
      type: object
      properties:
        creados: { type: integer }
        ya_existian: { type: integer }
        omitidos:
          type: array
          items: { type: integer }
          description: ids de origen que no se pudieron mapear/crear (padre faltante en destino).
      required: [creados, ya_existian, omitidos]

    DuplicarAnioResponse:
      type: object
      properties:
        id_anio_origen: { type: integer }
        id_anio_destino: { type: integer }
        estructura:
          type: object
          properties:
            niveles: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
            grados: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
            secciones: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
        cursos: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
        curriculo:
          type: object
          properties:
            aprendizajes: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
            competencias: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
            capacidades: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
        programacion_secciones: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
        programacion_cursos: { $ref: '#/components/schemas/DuplicarAnioResultadoBloque' }
      required: [id_anio_origen, id_anio_destino]

    GenerarPlantillasNotasRequest:
      type: object
      properties:
        id_anio: { type: integer }
      required: [id_anio]

    GenerarPlantillasNotasResponse:
      type: object
      description: >
        Cuenta de filas creadas en cada tabla. Si ya se había corrido antes
        para ese año, los conteos pueden salir en 0 (nada nuevo que generar).
      properties:
        id_anio: { type: integer }
        competencias_creadas: { type: integer }
        capacidades_creadas: { type: integer }
        competencias_bimestre_creadas: { type: integer }
        capacidades_bimestre_creadas: { type: integer }
      required: [id_anio, competencias_creadas, capacidades_creadas, competencias_bimestre_creadas, capacidades_bimestre_creadas]

    ChatMensajeUI:
      type: object
      description: >
        Mensaje en formato `UIMessage` del Vercel AI SDK. `parts` contiene
        partes de texto (`{type:"text", text}`) y de herramientas
        (`{type:"tool-<nombre>", state, input, output}`).
      properties:
        id: { type: string, example: "WoadvFglE5fkY3vr" }
        role: { type: string, enum: [user, assistant, system] }
        parts:
          type: array
          items: { type: object, additionalProperties: true }
      required: [id, role, parts]
      example:
        id: "WoadvFglE5fkY3vr"
        role: user
        parts:
          - { type: text, text: "¿Qué niveles tiene el año lectivo actual?" }
    ChatRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >
            Id de la conversación, generado por el cliente. Si no existe se
            crea con el primer mensaje.
        message:
          $ref: '#/components/schemas/ChatMensajeUI'
      required: [id, message]
    ChatConversacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, nullable: true, description: Primera pregunta (80 caracteres). }
        actualizado_en: { type: string, format: date-time }
      required: [id, titulo, actualizado_en]

  parameters:
    EstadoFilter:
      name: estado
      in: query
      description: Filtra por activo (true) o inactivo (false).
      schema: { type: boolean }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Token ausente, inválido o vencido, o usuario inactivo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: El usuario autenticado no tiene el rol requerido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Solicitud inválida (validación de campos)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto por restricción UNIQUE (duplicado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Error interno / de base de datos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /anios-lectivos:
    get:
      tags: [AniosLectivos]
      summary: Listar años lectivos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de años lectivos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnioLectivo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [AniosLectivos]
      summary: Crear año lectivo (rol ADMIN)
      description: "Campos obligatorios: `anio`, `nombre`. Opcional: `estado` (default true). Requiere el rol ADMIN."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnioLectivoCreate' }
      responses:
        '201':
          description: Año lectivo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /anios-lectivos/{id}:
    get:
      tags: [AniosLectivos]
      summary: Obtener año lectivo por id
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Año lectivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [AniosLectivos]
      summary: Actualizar año lectivo (rol ADMIN; no permite cambiar 'nombre' por ahora)
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno (`anio` o `estado`). Requiere el rol ADMIN."
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnioLectivoUpdate' }
      responses:
        '200':
          description: Año lectivo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /niveles:
    get:
      tags: [Niveles]
      summary: Listar niveles
      parameters:
        - name: id_anio_lectivo
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de niveles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Niveles]
      summary: Crear nivel
      description: "Campos obligatorios: `id_anio_lectivo`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NivelCreate' }
      responses:
        '201':
          description: Nivel creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /niveles/{id}:
    get:
      tags: [Niveles]
      summary: Obtener nivel por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Nivel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Niveles]
      summary: Actualizar nivel
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NivelUpdate' }
      responses:
        '200':
          description: Nivel actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /grados:
    get:
      tags: [Grados]
      summary: Listar grados
      parameters:
        - name: id_nivel
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de grados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Grados]
      summary: Crear grado
      description: "Campos obligatorios: `id_nivel`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradoCreate' }
      responses:
        '201':
          description: Grado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /grados/{id}:
    get:
      tags: [Grados]
      summary: Obtener grado por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Grado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Grados]
      summary: Actualizar grado
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradoUpdate' }
      responses:
        '200':
          description: Grado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /secciones:
    get:
      tags: [Secciones]
      summary: Listar secciones
      parameters:
        - name: id_grado
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de secciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Seccion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Secciones]
      summary: Crear sección
      description: "Campos obligatorios: `id_grado`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeccionCreate' }
      responses:
        '201':
          description: Sección creada
          content:
            application/json:
