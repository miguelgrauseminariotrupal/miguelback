  /login:
    post:
      tags: [Login]
      summary: Iniciar sesión (Supabase Auth)
      description: >
        `usuario` acepta el nombre de usuario o el correo. Devuelve un
        `access_token` (JWT) y un `refresh_token`. Las cuentas legadas (sin
        `auth_id`) se migran a Auth en su primer login correcto. Credenciales
        inválidas, usuario inactivo o inexistente responden el mismo 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /login/refresh:
    post:
      tags: [Login]
      summary: Renovar la sesión con el refresh_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refresh token inválido o vencido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

